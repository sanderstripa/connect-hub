name: Connect Hub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connect-hub-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build --build-arg CONNECT_HUB_REVISION="$(git rev-parse HEAD)"
      - run: python3 hub/container-smoke.py
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test -- --project unit --project components && npm run build
        working-directory: frontend
      - run: go test -shuffle=on -count=1 ./...
      - run: go test -race -count=1 ./internal/hub ./internal/web/controller ./internal/config
      - run: bash -n hub/install.sh hub/update.sh hub/check-upstream.sh && python3 -m py_compile hub/package.py hub/smoke.py
      - run: python3 hub/package.py
      - run: python3 hub/prepare-test-engines.py
      - name: Fresh installation, authentication, Xray traffic, update and backup
        run: python3 hub/smoke.py
      - name: Native systemd installation on disposable hosted runner
        run: |
          checksum=$(awk '$2=="connect-hub-linux-amd64.tar.gz" {print $1}' dist/SHA256SUMS)
          sudo bash hub/install.sh --package dist/connect-hub-linux-amd64.tar.gz --sha256 "$checksum" > /tmp/connect-hub-install.log
          sudo systemctl is-active --quiet connect-hub
          sudo test -s /etc/connect-hub/initial-access.txt
          sudo systemctl stop connect-hub
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: connect-hub-linux-amd64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/smoke-report.json
  upstream-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 775b2b0b26a699bb5ae361ce3c78b319ab790991
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts && npm run typecheck && npm test -- --project unit --project components && npm run build
        working-directory: frontend
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - run: go test -shuffle=on -count=1 ./...
