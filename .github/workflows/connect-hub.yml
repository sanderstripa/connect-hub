name: Connect Hub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_check:
        description: Verify the public README installation command on a fresh runner
        type: boolean
        default: false
      runtime_artifact_run:
        description: Optional prior build run for focused runtime diagnostics
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: connect-hub-${{ github.ref }}-${{ inputs.release_check || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: for script in install.sh x-ui.sh hub/*.sh; do bash -n "$script" || exit; done; python3 -m py_compile hub/*.py
      - run: python3 -m unittest discover -s hub -p '*_test.py'
      - run: python3 hub/wizard-smoke.py
      - name: Opt-in BBR and additional swap on this disposable VM only
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 -B hub/system-options-smoke.py
  container:
    if: ${{ !inputs.release_check && !inputs.runtime_artifact_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build --build-arg CONNECT_HUB_REVISION="$(git rev-parse HEAD)"
      - run: python3 hub/container-smoke.py
      - run: python3 hub/container-postgres-smoke.py
  linux:
    if: ${{ !inputs.release_check && !inputs.runtime_artifact_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
      # Private experimental Core is not a dependency of the stable public panel.
      CONNECT_HUB_TEST_CORE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test -- --project unit --project components && npm run build
        working-directory: frontend
      - run: go test -shuffle=on -count=1 ./...
      - run: go test -race -count=1 ./internal/hub ./internal/web/controller ./internal/config
      - run: for script in install.sh x-ui.sh hub/*.sh; do bash -n "$script" || exit; done; python3 -m py_compile hub/*.py
      - run: python3 hub/package.py
      - name: Original interactive setup with piped stdin and an SSH-style terminal
        run: python3 hub/interactive-config-smoke.py
      - name: Static panel runs on Debian 12
        run: test "$(docker run --rm -v "$PWD/dist/connect-hub:/panel:ro" debian:bookworm-slim /panel/connect-hub -v)" = "$(cat internal/config/version)"
      - name: Native systemd installation and failed-update rollback
        run: python3 hub/systemd-smoke.py
      - run: python3 hub/prepare-test-engines.py
      - name: Fresh installation, authentication, Xray traffic, update and backup
        run: python3 hub/smoke.py
      - name: Install browser for the actual shared inbound form
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Actual shared protocol picker, inbound list and device keys
        run: python3 hub/browser-smoke.py
      - name: Two actual version changes using the ordinary web update button
        run: python3 hub/web-update-smoke.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: connect-hub-linux-amd64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/smoke-report.json
            dist/unified-inbounds-*.png
            dist/connect-hub-*.png
            dist/connect-font-audit.json
            dist/connect-density-*.png
            dist/connect-density-audit.json
            dist/ui-*.png
            dist/ui-refinement-report.json
  windows-installer:
    if: ${{ !inputs.release_check && !inputs.runtime_artifact_run }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CONNECT_HUB_EXPECTED_REVISION: ${{ github.sha }}
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        working-directory: apps/windows-installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/windows-installer/package-lock.json
      - run: npm ci --ignore-scripts --omit=optional
      - run: node node_modules/electron/install.js
      - run: npm run prepare-assets
      - run: npm test
      - name: Actual Windows GUI, encrypted SSH and address-only QR
        run: node test/ui-smoke.cjs
      - run: npm run build
      - name: Test the packaged application and the actual portable EXE
        run: |
          node test/ui-smoke.cjs "../../dist/windows-installer/win-unpacked/Connect Hub Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/portable-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -Algorithm SHA256 ../../dist/windows-installer/Connect-Hub-Setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path ../../dist/windows-installer) 'SHA256SUMS'), "$digest  Connect-Hub-Setup.exe`n", [Text.UTF8Encoding]::new($false))
          Copy-Item assets/BUILD.json ../../dist/windows-installer/BUILD.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: connect-hub-windows-installer
          path: |
            dist/windows-installer/Connect-Hub-Setup.exe
            dist/windows-installer/SHA256SUMS
            dist/windows-installer/BUILD.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: connect-hub-windows-evidence
          path: |
            dist/desktop-evidence/*.png
  desktop-ssh:
    if: ${{ !inputs.release_check && !inputs.runtime_artifact_run }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v6
        with:
          name: connect-hub-linux-amd64
          path: dist
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: apps/windows-installer
      - run: npm run prepare-assets
        working-directory: apps/windows-installer
      - name: Actual detached SSH installation, reconnect and preserved-key traffic
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v node)" apps/windows-installer/test/linux-install-smoke.cjs
  upstream-baseline:
    if: ${{ !inputs.release_check && !inputs.runtime_artifact_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 775b2b0b26a699bb5ae361ce3c78b319ab790991
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts && npm run typecheck && npm test -- --project unit --project components && npm run build
        working-directory: frontend
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - run: go test -shuffle=on -count=1 ./...
  upgrade-alpha2:
    needs: linux
    if: ${{ !inputs.release_check && !inputs.runtime_artifact_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: connect-hub-linux-amd64
          path: dist
      - run: python3 hub/upgrade-alpha2-smoke.py
  public-release-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONNECT_HUB_TLS_MODE: selfsigned
    steps:
      - uses: actions/checkout@v7
      - run: python3 hub/release-smoke.py
  runtime-artifact-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_artifact_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 hub/ci-download.py
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.runtime_artifact_run }}
      - run: python3 hub/prepare-test-engines.py
      - run: python3 hub/smoke.py

