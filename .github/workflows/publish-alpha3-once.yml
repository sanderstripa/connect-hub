# One specific release only: fixed main commit and fixed successful build.
name: Publish tested Connect Hub alpha 3 once
on:
  push:
    branches: [release/alpha3-once]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'sanderstripa/connect-hub' && github.ref == 'refs/heads/release/alpha3-once'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cdb9175c0021d1bc937a564010499a37d67d79a9
          persist-credentials: false
      - name: Require this exact successful main build
        uses: actions/github-script@v8
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id: 40083178815});
            if(run.head_sha !== 'cdb9175c0021d1bc937a564010499a37d67d79a9' || run.head_branch !== 'main' || run.event !== 'push' || run.conclusion !== 'success') throw Error('The fixed main build has not passed');
            const {data: branch} = await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            if(branch.commit.sha !== 'cdb9175c0021d1bc937a564010499a37d67d79a9') throw Error('Main moved; do not publish a different revision');
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 40083178815
          name: connect-hub-linux-amd64
          path: dist
      - name: Verify exact native build and publish only alpha 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -xOf connect-hub-linux-amd64.tar.gz connect-hub/BUILD.json > BUILD.json
          python3 -c "import json; assert json.load(open('BUILD.json'))['revision']=='cdb9175c0021d1bc937a564010499a37d67d79a9'"
          gh release create v0.1.0-alpha.3 --repo sanderstripa/connect-hub --target cdb9175c0021d1bc937a564010499a37d67d79a9 --prerelease --title 'Connect Hub v0.1.0-alpha.3' --notes-file ../hub/RELEASE.md connect-hub-linux-amd64.tar.gz SHA256SUMS
  verify-public-installation:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cdb9175c0021d1bc937a564010499a37d67d79a9
          persist-credentials: false
      - name: Exact README command, HTTPS, device connections and web update
        env:
          CONNECT_HUB_TLS_MODE: selfsigned
        run: python3 hub/release-smoke.py

