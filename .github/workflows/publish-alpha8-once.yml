# One specific release only. Replace the two immutable values after main CI passes.
name: Publish tested Connect Hub alpha 8 once
on:
  push:
    branches: [release/alpha8-once]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'sanderstripa/connect-hub' && github.ref == 'refs/heads/release/alpha8-once'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f486f33e5b771f5abafebb207f7119e074d648b6
          persist-credentials: false
      - name: Require this exact successful main build
        uses: actions/github-script@v8
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id: 40192310528});
            if(run.head_sha !== 'f486f33e5b771f5abafebb207f7119e074d648b6' || run.head_branch !== 'main' || run.event !== 'push' || run.conclusion !== 'success') throw Error('The fixed main build has not passed');
            const {data: branch} = await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            if(branch.commit.sha !== 'f486f33e5b771f5abafebb207f7119e074d648b6') throw Error('Main moved; do not publish a different revision');
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 40192310528
          name: connect-hub-linux-amd64
          path: dist
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 40192310528
          name: connect-hub-windows-installer
          path: dist/windows
      - name: Verify exact native build and publish only alpha 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -xOf connect-hub-linux-amd64.tar.gz connect-hub/BUILD.json > BUILD.json
          python3 -c "import json; assert json.load(open('BUILD.json'))['revision']=='f486f33e5b771f5abafebb207f7119e074d648b6'"
          (cd windows && sha256sum --check SHA256SUMS)
          python3 -c "import json; b=json.load(open('windows/BUILD.json')); assert b['revision']=='f486f33e5b771f5abafebb207f7119e074d648b6' and b['dirty'] is False and b['version']=='0.1.0-alpha.8'"
          cp windows/Connect-Hub-Setup.exe .
          cat windows/SHA256SUMS >> SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create v0.1.0-alpha.8 --repo sanderstripa/connect-hub --target f486f33e5b771f5abafebb207f7119e074d648b6 --prerelease --title 'Connect. Hub v0.1.0-alpha.8' --notes-file ../hub/RELEASE.md connect-hub-linux-amd64.tar.gz Connect-Hub-Setup.exe SHA256SUMS
  verify-public-installation:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f486f33e5b771f5abafebb207f7119e074d648b6
          persist-credentials: false
      - name: Exact README command, HTTPS, device connections and web update
        env:
          CONNECT_HUB_TLS_MODE: selfsigned
        run: python3 hub/release-smoke.py
      - name: Require the exact public installation revision
        run: |
          test "$(sudo /opt/connect-hub/current/connect-hub -v)" = "0.1.0-alpha.8"
          sudo python3 -c "import json; assert json.load(open('/opt/connect-hub/current/BUILD.json'))['revision']=='f486f33e5b771f5abafebb207f7119e074d648b6'"


      - name: Real Ubuntu and Debian bootstrap without preinstalled curl or CA bundle
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          command=pathlib.Path('hub/INSTALL-COMMAND.txt').read_text().strip()
          assert command.endswith('bash "$t"\'')
          probe=command[:-len('bash "$t"\'')]+'bash -n "$t"; echo BOOTSTRAP_DOWNLOAD_VERIFIED\''
          bootstrap=pathlib.Path('install.sh').read_text()
          marker='version=$(python3 - amd64 '
          assert marker in bootstrap
          dependencies=pathlib.Path('dist/bootstrap-dependencies.sh').resolve()
          dependencies.parent.mkdir(exist_ok=True)
          dependencies.write_text(bootstrap.split(marker,1)[0]+'\necho DEPENDENCIES_VERIFIED\n')
          for image in ['ubuntu:24.04','debian:trixie-slim']:
              subprocess.run(['docker','run','--rm','-v',str(dependencies)+':/bootstrap-dependencies.sh:ro',image,'sh','-c','if command -v curl >/dev/null 2>&1; then echo Unexpected_preinstalled_curl >&2; exit 1; fi; '+probe+' && bash /bootstrap-dependencies.sh'],check=True)
              print('PASS: actual core/tuning dependency installation and HTTPS bootstrap download on '+image,flush=True)
          PY

      - name: Published native binary initializes its real SQLite database on Debian 12 and 13
        run: |
          docker run --rm --tmpfs /etc/connect-hub --tmpfs /var/log/connect-hub -v /opt/connect-hub/current:/panel:ro -e XUI_DB_FOLDER=/etc/connect-hub -e XUI_DB_TYPE=sqlite -e XUI_DB_DSN= -e XUI_LOG_FOLDER=/var/log/connect-hub -e XUI_MAIN_FOLDER=/panel -e XUI_BIN_FOLDER=/panel/bin -e NODE_TOKEN_ENCRYPTION=off debian:bookworm-slim /panel/connect-hub setting -username debian-smoke -password disposable-ci-password -port 2053 -listenIP 127.0.0.1 -webBasePath /debian-smoke/ -parallelTest
          docker run --rm --tmpfs /etc/connect-hub --tmpfs /var/log/connect-hub -v /opt/connect-hub/current:/panel:ro -e XUI_DB_FOLDER=/etc/connect-hub -e XUI_DB_TYPE=sqlite -e XUI_DB_DSN= -e XUI_LOG_FOLDER=/var/log/connect-hub -e XUI_MAIN_FOLDER=/panel -e XUI_BIN_FOLDER=/panel/bin -e NODE_TOKEN_ENCRYPTION=off debian:trixie-slim /panel/connect-hub setting -username debian-smoke -password disposable-ci-password -port 2053 -listenIP 127.0.0.1 -webBasePath /debian-smoke/ -parallelTest

  verify-public-alpha7-upgrade:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f486f33e5b771f5abafebb207f7119e074d648b6
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Actual published alpha.7 to this published version, ordinary button and real preserved-key traffic
        run: python3 hub/public-upgrade-alpha7-smoke.py

  verify-public-windows-executable:
    needs: publish
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CONNECT_HUB_EXPECTED_REVISION: f486f33e5b771f5abafebb207f7119e074d648b6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f486f33e5b771f5abafebb207f7119e074d648b6
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: apps/windows-installer
      - name: Verify and launch the actual public Windows download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-installer | Out-Null
          Invoke-WebRequest https://github.com/sanderstripa/connect-hub/releases/download/v0.1.0-alpha.8/Connect-Hub-Setup.exe -OutFile dist/windows-installer/Connect-Hub-Setup.exe
          Invoke-WebRequest https://github.com/sanderstripa/connect-hub/releases/download/v0.1.0-alpha.8/SHA256SUMS -OutFile dist/windows-installer/SHA256SUMS
          $expected = ((Get-Content dist/windows-installer/SHA256SUMS | Where-Object { $_ -match '  Connect-Hub-Setup.exe$' }) -split '  ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 dist/windows-installer/Connect-Hub-Setup.exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Published EXE checksum mismatch' }
          Push-Location apps/windows-installer
          node test/portable-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verified-public-windows-executable
          path: dist/desktop-evidence/*.png
