name: Connect Hub release
on:
  push:
    branches: [main]
    paths:
      - 'apps/windows-installer/**'
      - 'frontend/**'
      - 'internal/config/version'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CONNECT_HUB_EXPECTED_REVISION: ${{ github.sha }}
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    defaults:
      run:
        working-directory: apps/windows-installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/windows-installer/package-lock.json
      - run: npm ci --ignore-scripts --omit=optional
      - run: node node_modules/electron/install.js
      - run: npm run prepare-assets
      - run: npm test
      - name: Five presets, links, QR and reconnect in the real Windows GUI
        run: node test/ui-smoke.cjs
      - run: npm run build
      - name: Packaged Windows GUI and downloadable portable EXE
        run: |
          node test/ui-smoke.cjs "../../dist/windows-installer/win-unpacked/Connect Hub Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/portable-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -Algorithm SHA256 ../../dist/windows-installer/Connect-Hub-Setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path ../../dist/windows-installer) 'SHA256SUMS'), "$digest  Connect-Hub-Setup.exe`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-release-binary
          path: |
            dist/windows-installer/Connect-Hub-Setup.exe
            dist/windows-installer/SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-release-evidence
          path: dist/desktop-evidence/*.png
  panel-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
      CONNECT_HUB_TEST_CORE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test -- --project unit --project components && npm run build
        working-directory: frontend
      - run: go test ./internal/web -run TestEmbeddedFontsAndRangeRequests -count=1
      - run: python3 hub/package.py
      - name: Real native advanced connection creation and editing
        run: python3 apps/windows-installer/test/panel-api-smoke.py "$PWD/dist/connect-hub-linux-amd64.tar.gz"
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real panel Soulu light/dark, Onest and palette migration
        run: python3 hub/soulu-smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: panel-release-binary
          path: |
            dist/connect-hub-linux-amd64.tar.gz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: soulu-panel-evidence
          path: dist/soulu-*.png
  publish:
    needs: [windows, panel-api]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: desktop-release-binary
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: panel-release-binary
          path: panel-assets
      - name: Publish the tested panel and installer together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/windows-installer/package.json').version")
          tag="v${version}"
          cp panel-assets/connect-hub-linux-amd64.tar.gz release-assets/
          cat panel-assets/SHA256SUMS >> release-assets/SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Connect Hub: server removal from the Windows application.

          - Remove a managed Connect Hub server installation from Panel management, with a native confirmation naming the server. Deletes panel files, connections, keys, bundled certificates and installer job credentials. Preserves BBR, swap, external databases and unrelated services. Refuses foreign services and active installation jobs.
          - Local Onest 400/500/600, neutral white/graphite light/dark surfaces, blue actions and green connection states. Saved legacy palettes migrate while retaining the selected light/dark mode and panel data.
          - Advanced desktop create/edit sections: Basic, Protocol, Transport, Security, Sniffing and raw templates. Configure XHTTP modes, padding, headers, placements, XMUX, Sockopt, final masks and QUIC settings.
          - Native Reality X25519, ML-KEM encryption and ML-DSA key generation. TLS certificate paths refer to server files. Preserve existing client identities and unedited parameters on ordinary edits.
          - Advanced client parameters are propagated into supported share links and QR codes. Private server keys stay out of share links.

          Validated: actual Windows GUI and portable EXE, native CSRF-protected panel APIs, advanced XHTTP/Reality/sniffing editing, ML-KEM/ML-DSA generation, preserved keys and listening sockets; real panel routes in both Soulu themes. External client handshakes and provider firewall reachability are not covered.

          Alpha release. Update an existing server with the panel update menu or the installer. Links/QR codes contain private access credentials. Explicit key generation or raw client JSON edits can intentionally change credentials; ordinary field edits preserve them.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A release already exists for this installer version; refusing to replace published binaries.'
            exit 1
          fi
          gh release create "$tag" release-assets/Connect-Hub-Setup.exe release-assets/connect-hub-linux-amd64.tar.gz release-assets/SHA256SUMS --target "$GITHUB_SHA" --title "Connect Hub ${version} — server management" --notes-file release-notes.md --prerelease --latest=false
  public-install:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONNECT_HUB_TLS_MODE: selfsigned
    steps:
      - uses: actions/checkout@v7
      - name: Exact public install command and preserved-key server update
        run: python3 hub/release-smoke.py
