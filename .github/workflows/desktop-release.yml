name: Connect Hub release
on:
  push:
    branches: [main]
    paths:
      - 'apps/windows-installer/**'
      - 'frontend/**'
      - 'internal/config/version'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CONNECT_HUB_EXPECTED_REVISION: ${{ github.sha }}
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    defaults:
      run:
        working-directory: apps/windows-installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/windows-installer/package-lock.json
      - run: npm ci --ignore-scripts --omit=optional
      - run: node node_modules/electron/install.js
      - run: npm run prepare-assets
      - run: npm test
      - name: Five presets, links, QR and reconnect in the real Windows GUI
        run: node test/ui-smoke.cjs
      - run: npm run build
      - name: Packaged Windows GUI and downloadable portable EXE
        run: |
          node test/ui-smoke.cjs "../../dist/windows-installer/win-unpacked/Connect Hub Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/portable-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -Algorithm SHA256 ../../dist/windows-installer/Connect-Hub-Setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path ../../dist/windows-installer) 'SHA256SUMS'), "$digest  Connect-Hub-Setup.exe`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-release-binary
          path: |
            dist/windows-installer/Connect-Hub-Setup.exe
            dist/windows-installer/SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-release-evidence
          path: dist/desktop-evidence/*.png
  panel-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
      CONNECT_HUB_TEST_CORE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test -- --project unit --project components && npm run build
        working-directory: frontend
      - run: go test ./internal/web -run TestEmbeddedFontsAndRangeRequests -count=1
      - run: go test ./internal/web/controller ./internal/web/service ./internal/sub -run 'TestSudoku|TestInboundClientLinks' -count=1
      - run: python3 apps/windows-installer/test/uninstall-smoke.py
      - run: python3 hub/package.py
      - name: Real native advanced connection creation and editing
        run: python3 apps/windows-installer/test/panel-api-smoke.py "$PWD/dist/connect-hub-linux-amd64.tar.gz"
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real panel Soulu light/dark, Onest and palette migration
        run: python3 hub/soulu-smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: panel-release-binary
          path: |
            dist/connect-hub-linux-amd64.tar.gz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: soulu-panel-evidence
          path: dist/soulu-*.png
  publish:
    needs: [windows, panel-api]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: desktop-release-binary
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: panel-release-binary
          path: panel-assets
      - name: Publish the tested panel and installer together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/windows-installer/package.json').version")
          tag="v${version}"
          cp panel-assets/connect-hub-linux-amd64.tar.gz release-assets/
          cat panel-assets/SHA256SUMS >> release-assets/SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Compact navigation for Connect Hub.

          - Keep a permanent 56px icon rail with the C. brand. Hover shows labels without expanding the rail; click opens nested menus with keyboard, outside-click and Escape dismissal.
          - Move theme, GitHub and logout to the footer. Theme changes immediately and stays saved.
          - Move the existing global search to the upper-right corner. Keep Ctrl+K, real section/settings/client/inbound results and keyboard selection; include Appearance settings.
          - Preserve the two-column Connections workspace, inline client details, local searches and every existing route. Dashboard graphs, backend APIs and protocol configuration are unchanged.

          Validation: all nested menu routes, selected state, tooltips, click/repeat-click/outside/Escape dismissal, live theme and persisted preference, global search, 390/768/1024px viewport bounds, scoped Connections clients and QR in both themes. Includes the full frontend suite, packaged Windows EXE and public installation/update/removal checks with existing keys preserved.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A release already exists for this installer version; refusing to replace published binaries.'
            exit 1
          fi
          gh release create "$tag" release-assets/Connect-Hub-Setup.exe release-assets/connect-hub-linux-amd64.tar.gz release-assets/SHA256SUMS --target "$GITHUB_SHA" --title "Connect Hub ${version} — Compact navigation" --notes-file release-notes.md --prerelease --latest=false
  public-install:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONNECT_HUB_TLS_MODE: selfsigned
    steps:
      - uses: actions/checkout@v7
      - name: Exact public install command and preserved-key server update
        run: python3 hub/release-smoke.py
