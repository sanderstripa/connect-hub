name: Connect Hub 0.9.0 — fast compatibility checks
on:
  push:
    branches: [feat/connect-hub-0.9.0-merge-lab]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-0.9.0-fast-lab
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile every Go package without running tests
        run: |
          mkdir -p internal/web/dist
          printf '<html></html>\n' > internal/web/dist/index.html
          go test -run '^$' -count=1 ./internal/... ./tools/...
  ts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check source without hiding errors behind ignored builds
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run typecheck
