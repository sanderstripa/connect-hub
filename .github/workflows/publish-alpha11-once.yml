name: Build and publish Connect Hub alpha 11
on:
  push:
    branches: [release/alpha11-once]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8310ddb33c23b9ecad7132a7bae161d111221539
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: python3 hub/package.py
      - uses: actions/upload-artifact@v6
        with:
          name: alpha11-linux
          path: |
            dist/connect-hub-linux-amd64.tar.gz
            dist/SHA256SUMS
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        working-directory: apps/windows-installer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8310ddb33c23b9ecad7132a7bae161d111221539
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --omit=optional
      - run: node node_modules/electron/install.js
      - run: npm run build
      - shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 ../../dist/windows-installer/Connect-Hub-Setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path ../../dist/windows-installer) 'SHA256SUMS'), "$digest  Connect-Hub-Setup.exe`n", [Text.UTF8Encoding]::new($false))
          Copy-Item assets/BUILD.json ../../dist/windows-installer/BUILD.json
      - uses: actions/upload-artifact@v6
        with:
          name: alpha11-windows
          path: |
            dist/windows-installer/Connect-Hub-Setup.exe
            dist/windows-installer/SHA256SUMS
            dist/windows-installer/BUILD.json
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8310ddb33c23b9ecad7132a7bae161d111221539
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: alpha11-linux
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: alpha11-windows
          path: dist/windows
      - name: Publish the requested alpha 11 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cp windows/Connect-Hub-Setup.exe .
          cat windows/SHA256SUMS >> SHA256SUMS
          gh release create v0.1.0-alpha.11 --repo sanderstripa/connect-hub --target 8310ddb33c23b9ecad7132a7bae161d111221539 --prerelease --title 'Connect. Hub v0.1.0-alpha.11' --notes-file ../hub/RELEASE.md connect-hub-linux-amd64.tar.gz Connect-Hub-Setup.exe SHA256SUMS
          gh release view v0.1.0-alpha.11 --repo sanderstripa/connect-hub --json tagName,assets,url
