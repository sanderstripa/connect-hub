name: Build and publish Connect Hub alpha 12
on:
  push:
    branches: [release/alpha12-final]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CONNECT_HUB_TEST_CORE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6fac4f602508cd0c69847e6475b99181a1bc88dc
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - name: Reuse successful frontend and backend checks only for identical sources
        run: git diff --exit-code 7bcec9a5c2a99abc46a9a9d45ce518b95ea64be6 HEAD -- frontend internal go.mod go.sum
      - run: python3 -m py_compile hub/prepare-test-engines.py hub/smoke.py
      - run: python3 -m unittest discover -s hub -p '*_test.py'
      - run: python3 hub/package.py
      - run: python3 hub/prepare-test-engines.py
      - name: Parallel install, native Sudoku traffic, update and data retention
        run: python3 hub/smoke.py
      - name: Interactive install and systemd rollback
        run: python3 hub/interactive-config-smoke.py && python3 hub/systemd-smoke.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Shared protocol picker and both Connect Hub themes
        run: python3 hub/browser-smoke.py
      - name: Ordinary web update transitions
        run: python3 hub/web-update-smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: alpha12-linux
          path: |
            dist/connect-hub-linux-amd64.tar.gz
            dist/SHA256SUMS
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        working-directory: apps/windows-installer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6fac4f602508cd0c69847e6475b99181a1bc88dc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --omit=optional
      - run: node node_modules/electron/install.js
      - run: npm run build
      - shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 ../../dist/windows-installer/Connect-Hub-Setup.exe).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path ../../dist/windows-installer) 'SHA256SUMS'), "$digest  Connect-Hub-Setup.exe`n", [Text.UTF8Encoding]::new($false))
          Copy-Item assets/BUILD.json ../../dist/windows-installer/BUILD.json
      - uses: actions/upload-artifact@v6
        with:
          name: alpha12-windows
          path: |
            dist/windows-installer/Connect-Hub-Setup.exe
            dist/windows-installer/SHA256SUMS
            dist/windows-installer/BUILD.json
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6fac4f602508cd0c69847e6475b99181a1bc88dc
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: alpha12-linux
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: alpha12-windows
          path: dist/windows
      - name: Publish the requested alpha 12 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cp windows/Connect-Hub-Setup.exe .
          cat windows/SHA256SUMS >> SHA256SUMS
          gh release create v0.1.0-alpha.12 --repo sanderstripa/connect-hub --target 6fac4f602508cd0c69847e6475b99181a1bc88dc --prerelease --title 'Connect. Hub v0.1.0-alpha.12' --notes-file ../hub/RELEASE.md connect-hub-linux-amd64.tar.gz Connect-Hub-Setup.exe SHA256SUMS
          gh release view v0.1.0-alpha.12 --repo sanderstripa/connect-hub --json tagName,assets,url
