# One specific release only. Replace the two immutable values after main CI passes.
name: Publish tested Connect Hub alpha 5 once
on:
  push:
    branches: [release/alpha5-once]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'sanderstripa/connect-hub' && github.ref == 'refs/heads/release/alpha5-once'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28
          persist-credentials: false
      - name: Require this exact successful main build
        uses: actions/github-script@v8
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id: 40095449510});
            if(run.head_sha !== 'c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28' || run.head_branch !== 'main' || run.event !== 'push' || run.conclusion !== 'success') throw Error('The fixed main build has not passed');
            const {data: branch} = await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'});
            if(branch.commit.sha !== 'c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28') throw Error('Main moved; do not publish a different revision');
      - uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 40095449510
          name: connect-hub-linux-amd64
          path: dist
      - name: Verify exact native build and publish only alpha 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -xOf connect-hub-linux-amd64.tar.gz connect-hub/BUILD.json > BUILD.json
          python3 -c "import json; assert json.load(open('BUILD.json'))['revision']=='c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28'"
          gh release create v0.1.0-alpha.5 --repo sanderstripa/connect-hub --target c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28 --prerelease --title 'Connect Hub v0.1.0-alpha.5' --notes 'Restores the original 3x-ui database, port, credentials and TLS configuration flow, upstream root-service behavior, and common inbound fields when switching protocols. Sudoku uses the ordinary protocol selector without a mandatory server-address field. Future release discovery is dynamic. Full main CI must pass before publication; fresh public installation and an actual public alpha.4 upgrade through the ordinary browser button are release checks in this workflow. Mandatory GPL/upstream notices remain intact.' connect-hub-linux-amd64.tar.gz SHA256SUMS
  verify-public-installation:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28
          persist-credentials: false
      - name: Exact README command, HTTPS, device connections and web update
        env:
          CONNECT_HUB_TLS_MODE: selfsigned
        run: python3 hub/release-smoke.py


  verify-public-alpha4-upgrade:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c6fe8a44aac4b3e9ec761d02dcb0428c70afbc28
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Actual published alpha.4 to this published version, ordinary button and real preserved-key traffic
        run: python3 hub/public-upgrade-alpha4-smoke.py
